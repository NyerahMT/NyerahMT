<svg
    width="720"
    height="310"
    viewBox="0 0 720 310"
    xmlns="http://www.w3.org/2000/svg"
>

<defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0d1117"/>
        <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <pattern
        id="grid"
        width="22"
        height="22"
        patternUnits="userSpaceOnUse"
    >
        <path
            d="M 22 0 L 0 0 0 22"
            fill="none"
            stroke="#30363d"
            stroke-width="0.55"
            opacity="0.42"
        />
    </pattern>
</defs>

<style>
.title {
    fill: #f0f6fc;
    font: 700 23px -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
}

.subtitle {
    fill: #8b949e;
    font: 13px -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
}

.number {
    fill: #f0f6fc;
    font: 700 27px -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
}

.label {
    fill: #c9d1d9;
    font: 13px -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
}

.footer {
    fill: #8b949e;
    font: 12px -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
}
</style>

<rect
    width="720"
    height="310"
    rx="14"
    fill="url(#background)"
/>

<rect
    x="1"
    y="1"
    width="718"
    height="308"
    rx="13"
    fill="none"
    stroke="#30363d"
    stroke-width="2"
/>

<rect
    x="22"
    y="72"
    width="676"
    height="180"
    fill="url(#grid)"
